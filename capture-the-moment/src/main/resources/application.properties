spring.application.name=capture-the-moment

spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-timeout=30000

transcription.service.url=${TRANSCRIPTION_SERVICE_URL:http://localhost:8000}

security.jwt.secret=${JWT_SECRET:capture-the-moment-development-secret-change-me-32}
security.jwt.expiration=${JWT_EXPIRATION:PT8H}
