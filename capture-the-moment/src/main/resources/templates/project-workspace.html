<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Project | Capture the Moment</title>
    <style>
      :root { font-family: Segoe UI, system-ui, sans-serif; color: #172033; }
      body { margin: 0; min-height: 100vh; background: #f4f6f8; }
      .layout { display: flex; min-height: 100vh; }
      aside { box-sizing: border-box; width: 260px; padding: 28px 18px; background: #172033; color: white; }
      .brand { display: block; margin: 0 12px 36px; font-weight: 700; }
      .back { display: block; margin: 0 8px 28px; color: #d8e0ff; text-decoration: none; }
      nav { display: grid; gap: 8px; }
      nav button { border: 0; border-radius: 8px; padding: 13px 14px; color: #d8e0ff; background: transparent; text-align: left; font: inherit; cursor: pointer; }
      nav button:hover, nav button.active { color: white; background: #3155d9; }
      main { flex: 1; padding: 44px clamp(24px, 7vw, 96px); }
      .content { max-width: 840px; padding: 32px; background: white; border-radius: 16px; box-shadow: 0 8px 24px #17203312; }
      h1 { margin-top: 0; } .muted { color: #5b6475; }
      .section-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
      .member-list { display: grid; gap: 10px; margin-top: 24px; }
      .member { padding: 14px; background: #f4f6f8; border-radius: 8px; }
      .audio-list, .transcript-list { display: grid; gap: 14px; margin-top: 20px; }
      .audio-item, .transcript-item { padding: 16px; background: #f4f6f8; border-radius: 8px; }
      .audio-item a { color: #3155d9; font-weight: 700; }
      audio { display: block; width: 100%; margin-top: 12px; }
      .segment { border-top: 1px solid #dce1ea; padding: 10px 0; }
      .segment:first-child { border-top: 0; }
      form { display: grid; gap: 10px; margin-top: 20px; padding: 16px; border: 1px solid #dce1ea; border-radius: 8px; }
      input, button { box-sizing: border-box; font: inherit; }
      input { padding: 10px; border: 1px solid #c9ced8; border-radius: 8px; }
      .action { border: 0; border-radius: 8px; padding: 10px 14px; color: white; background: #3155d9; font-weight: 700; cursor: pointer; }
      .error { color: #b42318; }
      @media (max-width: 640px) {
        .layout { display: block; }
        aside { width: 100%; min-height: auto; padding: 20px; }
        .brand { margin-bottom: 20px; } .back { margin-bottom: 16px; }
        nav { grid-template-columns: repeat(2, 1fr); }
        main { padding: 24px 16px; }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside>
        <span class="brand">Capture the Moment</span>
        <a class="back" href="/dashboard">&larr; Back to dashboard</a>
        <nav aria-label="Project sections">
          <button class="active" type="button" data-section="audios">Audios</button>
          <button type="button" data-section="transcription">Transcription</button>
          <button type="button" data-section="kanban">Kanban</button>
          <button type="button" data-section="chit-chat">Chit-chat</button>
          <button type="button" data-section="members">Members</button>
        </nav>
      </aside>
      <main>
        <section class="content" aria-live="polite">
          <div class="section-header">
            <h1 id="project-title">Project</h1>
          </div>
          <p id="section-description" class="muted">Select a section from the project menu.</p>
          <div id="audio-section" hidden>
            <form id="audio-form">
              <label for="audio-file">Choose an audio file</label>
              <input id="audio-file" type="file" accept=".mp3,.wav,.m4a,.flac,.ogg,audio/*" required />
              <button class="action" type="submit">Upload and transcribe</button>
              <span id="audio-message" class="muted" role="status"></span>
            </form>
            <div id="audio-list" class="audio-list"></div>
          </div>
          <div id="transcription-section" class="transcript-list" hidden></div>
          <div id="members-section" hidden>
            <div class="member-actions">
              <button id="add-member-button" class="action" type="button" hidden>Add member</button>
            </div>
            <form id="add-member-form" hidden>
              <label for="member-username">Member username</label>
              <input id="member-username" required maxlength="100" autocomplete="off" />
              <button class="action" type="submit">Add member</button>
              <span id="member-message" class="muted" role="status"></span>
            </form>
            <div id="member-list" class="member-list"></div>
          </div>
        </section>
      </main>
    </div>
    <script>
      const descriptions = {
        audios: "Upload and manage the audio files for this project.",
        transcription: "Review and manage transcriptions for this project.",
        kanban: "Organize project work with a kanban board.",
        "chit-chat": "Collaborate with your project members in chit-chat.",
        members: "View the members who have access to this project."
      };
      const params = new URLSearchParams(window.location.search);
      const projectId = params.get("projectId");
      const title = document.getElementById("project-title");
      const description = document.getElementById("section-description");
      const addMemberButton = document.getElementById("add-member-button");
      const addMemberForm = document.getElementById("add-member-form");
      const memberList = document.getElementById("member-list");
      const memberMessage = document.getElementById("member-message");
      const membersSection = document.getElementById("members-section");
      const audioSection = document.getElementById("audio-section");
      const audioForm = document.getElementById("audio-form");
      const audioList = document.getElementById("audio-list");
      const audioMessage = document.getElementById("audio-message");
      const transcriptionSection = document.getElementById("transcription-section");
      let currentProject;
      const csrfHeaders = () => ({
        [document.querySelector('meta[name="_csrf_header"]')?.content || "X-CSRF-TOKEN"]:
          document.querySelector('meta[name="_csrf"]')?.content || ""
      });
      async function readResponse(response) {
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || data.message || "Request failed.");
        return data;
      }
      function renderMembers(members) {
        memberList.replaceChildren();
        if (!members.length) {
          memberList.innerHTML = '<p class="muted">No members found.</p>';
          return;
        }
        function formatTime(seconds) {
          const totalSeconds = Math.max(0, Number(seconds) || 0);
          const minutes = Math.floor(totalSeconds / 60);
          const remainingSeconds = Math.floor(totalSeconds % 60);
          return `${String(minutes).padStart(2, "0")}:${String(remainingSeconds).padStart(2, "0")}`;
        }
        members.forEach(member => {
          const item = document.createElement("div");
          item.className = "member";
          item.innerHTML = "<strong></strong>";
          item.querySelector("strong").textContent = member.username;
          memberList.append(item);
        });
      }
      async function loadMembers() {
        if (!projectId) return;
        renderMembers(await readResponse(await fetch(`/project/${projectId}/members`)));
      }
      function renderAudios(audios) {
        audioList.replaceChildren();
        if (!audios.length) {
          audioList.innerHTML = '<p class="muted">No audio files uploaded yet.</p>';
          return;
        }
        audios.forEach(audio => {
          const item = document.createElement("div");
          item.className = "audio-item";
          const link = document.createElement("a");
          link.href = `/api/project/${projectId}/audios/${audio.audioId}/content`;
          link.textContent = audio.fileName;
          link.target = "_blank";
          link.rel = "noopener";
          const status = document.createElement("span");
          status.className = "muted";
          status.textContent = ` · ${audio.status}`;
          const player = document.createElement("audio");
          player.controls = true;
          player.preload = "none";
          player.src = link.href;
          item.append(link, status, player);
          audioList.append(item);
        });
      }
      async function loadAudios() {
        renderAudios(await readResponse(await fetch(`/api/project/${projectId}/audios`)));
      }
      async function loadTranscriptions() {
        transcriptionSection.replaceChildren();
        const audios = await readResponse(await fetch(`/api/project/${projectId}/audios`));
        for (const audio of audios) {
          const item = document.createElement("article");
          item.className = "transcript-item";
          const heading = document.createElement("h3");
          heading.textContent = audio.fileName;
          item.append(heading);
          try {
            const transcript = await readResponse(await fetch(
              `/api/project/${projectId}/audios/${audio.audioId}/transcription`));
            if (transcript.language) {
              const language = document.createElement("p");
              language.className = "muted";
              language.textContent = `Language: ${transcript.language}`;
              item.append(language);
            }
            if (transcript.text) {
              const fullText = document.createElement("p");
              fullText.textContent = transcript.text;
              item.append(fullText);
            }
            transcript.segments.forEach(segment => {
              const row = document.createElement("div");
              row.className = "segment";
              row.textContent = `${formatTime(segment.start)} – ${formatTime(segment.end)} · ${segment.speaker || "UNKNOWN"}: ${segment.text || ""}`;
              item.append(row);
            });
          } catch (error) {
            const pending = document.createElement("p");
            pending.className = "muted";
            pending.textContent = audio.status === "TRANSCRIPTION_FAILED"
              ? "Transcription failed for this audio." : "Transcription is not available yet.";
            item.append(pending);
          }
          transcriptionSection.append(item);
        }
        if (!audios.length) {
          transcriptionSection.innerHTML = '<p class="muted">No transcriptions available yet.</p>';
        }
      }
      function showSection(section) {
        const membersSelected = section === "members";
        const audioSelected = section === "audios";
        const transcriptionSelected = section === "transcription";
        audioSection.hidden = !audioSelected;
        transcriptionSection.hidden = !transcriptionSelected;
        membersSection.hidden = !membersSelected;
        addMemberButton.hidden = !membersSelected || !currentProject?.admin;
        addMemberForm.hidden = true;
        memberMessage.textContent = "";
        if (audioSelected) loadAudios().catch(error => {
          audioList.textContent = error.message;
        });
        if (transcriptionSelected) loadTranscriptions().catch(error => {
          transcriptionSection.textContent = error.message;
        });
        if (membersSelected) loadMembers().catch(error => {
          memberList.replaceChildren();
          const errorMessage = document.createElement("p");
          errorMessage.className = "error";
          errorMessage.textContent = error.message;
          memberList.append(errorMessage);
        });
      }
      async function loadProject() {
        if (!projectId) throw new Error("A project was not selected.");
        const project = (await readResponse(await fetch("/project")))
          .find(item => String(item.projectId) === projectId);
        if (!project) throw new Error("You do not have access to this project.");
        currentProject = project;
        title.textContent = project.projectName;
        showSection("audios");
      }
      document.querySelectorAll("[data-section]").forEach(button => {
        button.addEventListener("click", () => {
          document.querySelector(".active").classList.remove("active");
          button.classList.add("active");
          description.textContent = descriptions[button.dataset.section];
          showSection(button.dataset.section);
        });
      });
      addMemberButton.addEventListener("click", () => {
        addMemberForm.hidden = !addMemberForm.hidden;
        if (!addMemberForm.hidden) document.getElementById("member-username").focus();
      });
      addMemberForm.addEventListener("submit", async event => {
        event.preventDefault();
        memberMessage.textContent = "Adding member...";
        try {
          await readResponse(await fetch(`/project/${projectId}/members`, {
            method: "POST",
            headers: { "Content-Type": "application/json", ...csrfHeaders() },
            body: JSON.stringify({
              username: document.getElementById("member-username").value
            })
          }));
          event.target.reset();
          addMemberForm.hidden = true;
          memberMessage.textContent = "";
          if (document.querySelector("[data-section].active")?.dataset.section === "members") {
            await loadMembers();
          }
        } catch (error) {
          memberMessage.textContent = error.message;
          memberMessage.className = "error";
        }
      });
      audioForm.addEventListener("submit", async event => {
        event.preventDefault();
        const file = document.getElementById("audio-file").files[0];
        if (!file) return;
        audioMessage.textContent = "Uploading and transcribing...";
        try {
          await readResponse(await fetch(`/api/project/${projectId}/audios`, {
            method: "POST",
            headers: csrfHeaders(),
            body: (() => {
              const data = new FormData();
              data.append("file", file);
              return data;
            })()
          }));
          event.target.reset();
          audioMessage.textContent = "Audio uploaded and transcription saved.";
          await loadAudios();
        } catch (error) {
          audioMessage.textContent = error.message;
          audioMessage.className = "error";
        }
      });
      loadProject().catch(error => {
        title.textContent = "Project unavailable";
        description.textContent = error.message;
        description.className = "error";
      });
    </script>
  </body>
</html>
