<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Project settings | Capture the Moment</title>
    <style>
      :root { font-family: Segoe UI, system-ui, sans-serif; color: #172033; }
      body { margin: 0; background: #f4f6f8; } header { padding: 20px 8%; background: #172033; color: white; }
      header a { color: white; } main { width: min(620px, calc(100% - 32px)); margin: 40px auto; }
      section { padding: 24px; margin-top: 20px; background: white; border-radius: 14px; box-shadow: 0 8px 24px #17203312; }
      form { display: grid; gap: 12px; } label { font-weight: 600; }
      input { box-sizing: border-box; width: 100%; padding: 11px; border: 1px solid #c9ced8; border-radius: 8px; font: inherit; }
      button { padding: 11px 16px; border: 0; border-radius: 8px; background: #3155d9; color: white; font-weight: 700; cursor: pointer; }
      .danger { background: #b42318; } .muted { color: #5b6475; } .error { color: #b42318; }
    </style>
  </head>
  <body>
    <header><a href="/dashboard">Back to dashboard</a></header>
    <main>
      <h1>Project settings</h1><p id="message" role="status"></p>
      <section>
        <h2>Project details</h2>
        <form id="project-form">
          <label for="project-name">Project name</label>
          <input id="project-name" maxlength="100" required />
          <p id="details" class="muted"></p>
          <button type="submit">Save changes</button>
        </form>
      </section>
      <section>
        <h2>Delete project</h2>
        <p class="muted">This permanently deletes the project and its memberships.</p>
        <button id="delete-project" class="danger">Delete project</button>
      </section>
    </main>
    <script>
      const projectId = window.location.pathname.split("/")[2];
      const message = document.getElementById("message");
      const csrf = () => ({
        [document.querySelector('meta[name="_csrf_header"]').content]:
          document.querySelector('meta[name="_csrf"]').content
      });
      async function read(response) {
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || data.message || "Request failed.");
        return data;
      }
      async function load() {
        const projects = await read(await fetch("/project"));
        const project = projects.find(item => String(item.projectId) === projectId);
        if (!project || !project.admin) throw new Error("Only project administrators can access settings.");
        document.getElementById("project-name").value = project.projectName;
        document.getElementById("details").textContent =
          `Project ID: ${project.projectId} · Created by ${project.createdBy} on ${new Date(project.createdAt).toLocaleString()}`;
      }
      document.getElementById("project-form").addEventListener("submit", async event => {
        event.preventDefault();
        try {
          await read(await fetch(`/project/${projectId}`, {
            method: "PATCH", headers: { "Content-Type": "application/json", ...csrf() },
            body: JSON.stringify({ projectName: document.getElementById("project-name").value })
          }));
          message.textContent = "Project settings saved.";
        } catch (error) { message.textContent = error.message; message.className = "error"; }
      });
      document.getElementById("delete-project").addEventListener("click", async () => {
        if (!confirm("Delete this project permanently?")) return;
        try {
          await read(await fetch(`/project/${projectId}`, { method: "DELETE", headers: csrf() }));
          window.location.href = "/dashboard";
        } catch (error) { message.textContent = error.message; message.className = "error"; }
      });
      load().catch(error => {
        message.textContent = error.message; message.className = "error";
        document.getElementById("project-form").hidden = true;
        document.getElementById("delete-project").hidden = true;
      });
    </script>
  </body>
</html>
