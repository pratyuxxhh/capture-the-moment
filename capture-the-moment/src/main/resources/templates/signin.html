<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | Capture the Moment</title>
    <style>
      :root { font-family: Segoe UI, system-ui, sans-serif; color: #172033; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef2ff; }
      main { width: min(420px, calc(100% - 32px)); padding: 32px; background: white; border-radius: 16px; box-shadow: 0 12px 32px #1720331c; }
      h1 { margin-top: 0; } .hint { color: #5b6475; }
      form { display: grid; gap: 12px; } label { font-weight: 600; }
      input { box-sizing: border-box; width: 100%; padding: 11px; border: 1px solid #c9ced8; border-radius: 8px; font: inherit; }
      button { padding: 11px; border: 0; border-radius: 8px; background: #3155d9; color: white; font-weight: 700; cursor: pointer; }
      .actions { display: flex; gap: 10px; } .actions button { flex: 1; }
      .secondary { background: #e8ebf3; color: #172033; } #message { min-height: 1.4em; color: #3155d9; }
      .error { color: #b42318 !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>Welcome back</h1>
      <p class="hint">Create an account or sign in to Capture the Moment.</p>
      <form id="auth-form">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="8" autocomplete="current-password" required />
        <div class="actions">
          <button type="submit" data-action="login">Log in</button>
          <button type="button" class="secondary" data-action="signin">Create account</button>
        </div>
      </form>
      <p id="message" role="status"></p>
    </main>
    <script>
      const form = document.getElementById("auth-form");
      const message = document.getElementById("message");
      async function submit(action) {
        message.className = "";
        message.textContent = "Please wait...";
        const response = await fetch(`/auth/${action}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ username: form.username.value, password: form.password.value })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.message || "Request failed.");
        message.textContent = payload.message;
        if (action === "login") window.location.href = "/";
      }
      form.addEventListener("submit", event => {
        event.preventDefault();
        submit("login").catch(error => { message.className = "error"; message.textContent = error.message; });
      });
      document.querySelector('[data-action="signin"]').addEventListener("click", () => {
        submit("signin").catch(error => { message.className = "error"; message.textContent = error.message; });
      });
    </script>
  </body>
</html>
