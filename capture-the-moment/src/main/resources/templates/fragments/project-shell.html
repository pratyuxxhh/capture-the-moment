<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="/js/auth.js"></script>
  <title th:text="${title} + ' | Capture the Moment'">Project | Capture the Moment</title>
  <style>
    :root { font-family: Segoe UI, system-ui, sans-serif; color: #172033; }
    body { margin: 0; min-height: 100vh; background: #f4f6f8; }
    .layout { display: flex; min-height: 100vh; }
    aside { box-sizing: border-box; width: 260px; padding: 28px 18px; background: #172033; color: white; }
    .brand { display: block; margin: 0 12px 36px; font-weight: 700; }
    .back { display: block; margin: 0 8px 28px; color: #d8e0ff; text-decoration: none; }
    nav { display: grid; gap: 8px; }
    nav a { border-radius: 8px; padding: 13px 14px; color: #d8e0ff; text-decoration: none; }
    nav a:hover, nav a.active { color: white; background: #3155d9; }
    main { flex: 1; padding: 44px clamp(24px, 7vw, 96px); }
    .content { max-width: 1100px; padding: 32px; background: white; border-radius: 16px; box-shadow: 0 8px 24px #17203312; }
    h1 { margin-top: 0; } .muted { color: #5b6475; } .error { color: #b42318; }
    .action { border: 0; border-radius: 8px; padding: 10px 14px; color: white; background: #3155d9; font-weight: 700; cursor: pointer; }
    .danger-action { margin-top: 12px; background: #b42318; }
    button:disabled { cursor: not-allowed; opacity: .6; }
    input, textarea, button { box-sizing: border-box; font: inherit; }
    input, textarea { padding: 10px; border: 1px solid #c9ced8; border-radius: 8px; }
    .audio-list, .transcript-list, .member-list { display: grid; gap: 14px; margin-top: 20px; }
    .audio-item, .transcript-item, .member { padding: 16px; background: #f4f6f8; border-radius: 8px; }
    .transcript-actions { display: flex; gap: 10px; margin-top: 14px; }
    .back-link { display: inline-block; margin-bottom: 20px; color: #3155d9; text-decoration: none; }
    .audio-item a { color: #3155d9; font-weight: 700; } audio { display: block; width: 100%; margin-top: 12px; }
    .segment { border-top: 1px solid #dce1ea; padding: 10px 0; } .segment:first-child { border-top: 0; }
    form { display: grid; gap: 10px; margin-top: 20px; padding: 16px; border: 1px solid #dce1ea; border-radius: 8px; }
    @media (max-width: 640px) { .layout { display: block; } aside { width: 100%; min-height: auto; padding: 20px; } nav { grid-template-columns: repeat(2, 1fr); } main { padding: 24px 16px; } }
  </style>
</head>
<body>
<div class="layout" th:fragment="shell(active, content)">
  <aside>
    <span class="brand">Capture the Moment</span>
    <a class="back" href="/dashboard">&larr; Back to dashboard</a>
    <nav aria-label="Project sections">
      <a th:classappend="${active == 'audios'} ? ' active'" th:href="@{/projects/{id}/audios(id=${projectId})}">Audios</a>
      <a th:classappend="${active == 'transcription'} ? ' active'" th:href="@{/projects/{id}/transcription(id=${projectId})}">Transcription</a>
      <a th:classappend="${active == 'kanban'} ? ' active'" th:href="@{/projects/{id}/kanban(id=${projectId})}">Kanban</a>
      <a th:classappend="${active == 'chat'} ? ' active'" th:href="@{/projects/{id}/chit-chat(id=${projectId})}">Chit-chat</a>
      <a th:classappend="${active == 'members'} ? ' active'" th:href="@{/projects/{id}/members(id=${projectId})}">Members</a>
    </nav>
  </aside>
  <main><section class="content" th:insert="${content}"></section></main>
</div>
</body>
</html>
